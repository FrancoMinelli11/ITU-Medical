[pytest]
asyncio_mode = auto
# Un único event loop por worker: el engine async de SQLAlchemy y los clientes
# Redis se reutilizan entre tests sin caer en conexiones atadas a un loop cerrado.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = backend/tests
pythonpath = backend
addopts = -q --strict-markers
markers =
    serial: test que no debe ejecutarse en paralelo (concurrencia real)
    integration: requiere PostgreSQL real
    slow: test lento
