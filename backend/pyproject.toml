[project]
name = "turnos-api"
version = "0.1.0"
description = "Sistema web de gestión de turnos médicos"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.14,<2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "email-validator>=2.2,<3.0",
  "pyjwt>=2.10,<3.0",
  "argon2-cffi>=23.1,<24.0",
  "structlog>=24.4,<26.0",
  "slowapi>=0.1.9,<1.0",
  "redis>=5.2,<6.0",
  "arq>=0.26,<1.0",
  "python-multipart>=0.0.20,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-xdist>=3.6,<4.0",
  "httpx>=0.28,<1.0",
  "factory-boy>=3.3,<4.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
]

# Es una aplicación, no una librería: no se empaqueta ni se instala a sí misma.
# El paquete `app` se resuelve con PYTHONPATH (Dockerfile) y `pythonpath` (pytest.ini).
[tool.uv]
package = false
